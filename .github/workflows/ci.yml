name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - if: matrix.python-version == '3.12'
        run: python -m ruff check .
      - if: matrix.python-version == '3.12'
        run: python scripts/check_public_repository.py
      - run: python -m pytest

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - name: Validate integrated perception Dockerfile
        run: docker build --check --file services/perception/Dockerfile .
      - run: docker build --tag football-intelligence:ci .
      - run: docker run --rm football-intelligence:ci python -m pip check
      - run: docker run --detach --name football-intelligence-ci --publish 127.0.0.1:8080:8080 football-intelligence:ci
      - name: Wait for the health endpoint
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs football-intelligence-ci
          exit 1
      - if: always()
        run: docker rm --force football-intelligence-ci || true
