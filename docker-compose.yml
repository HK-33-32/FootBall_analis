name: football-intelligence

services:
  api:
    build:
      context: .
    image: football-intelligence:0.1.0
    user: "${FI_CONTAINER_UID:-10001}:${FI_CONTAINER_GID:-10001}"
    ports:
      - "127.0.0.1:${FI_PORT:-8080}:8080"
    volumes:
      - ./data:/data
      # finished matches: one directory per match, holding match_report.json
      # and the clip it came from. Writable, because the service now runs the
      # analysis as well as showing it; mount it :ro for a viewer-only setup.
      - "${FI_REPORTS:-./runs}:/reports"
    environment:
      FI_DATA_DIR: /data/runtime
      FI_REPORTS_DIR: /reports
      # the perception container, as this one sees it. It is started outside
      # this compose file, so it is reached through the host.
      FI_CORE_URL: "${FI_CORE_URL:-http://host.docker.internal:8000}"
      # a directory both containers can see: written here, read there
      FI_MEDIA_DIR: /data/perception_benchmark/media
      FI_MEDIA_CONTAINER_ROOT: "${FI_MEDIA_CONTAINER_ROOT:-/data/media}"
      FI_CHUNK_SECONDS: "${FI_CHUNK_SECONDS:-60}"
      FI_CONFIG: /app/configs/local_16gb.yaml
      FI_REPORT_METRICS: /app/configs/report_metrics.json
      FI_PERCEPTION_URL: "${FI_PERCEPTION_URL:-}"
      FI_PERCEPTION_API_KEY: "${FI_PERCEPTION_API_KEY:-}"
      FI_VLM_BASE_URL: "${FI_VLM_BASE_URL:-}"
      FI_VLM_MODEL: "${FI_VLM_MODEL:-Qwen/Qwen3-VL-8B-Instruct}"
      FI_VLM_REVISION: "${FI_VLM_REVISION:-a115a837cf3cbba4b697aa74b609721b5009ed41}"
      FI_VLM_API_KEY: "${FI_VLM_API_KEY:-EMPTY}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  perception:
    profiles: ["full"]
    build:
      context: .
      dockerfile: services/perception/Dockerfile
      args:
        PERCEPTION_STAGE: "${FI_PERCEPTION_STAGE:-runtime}"
        CUDA_ARCHS: "${FI_CUDA_ARCHS:-89;120}"
    image: "${FI_PERCEPTION_IMAGE:-football-intelligence-perception:0.1.0}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Matches api's FI_MEDIA_DIR -> /data/media inside this container.
      - ./data/perception_benchmark:/data
      - "${FI_WEIGHTS_DIR:-./weights}:/opt/weights"
    environment:
      FG_CHECKPOINT_DIR: /opt/weights/checkpoints
      TORCH_HOME: /opt/weights/torch
      RF_HOME: /opt/weights/rfdetr
      FG_DEFAULT_RENDER_VIDEO: "false"
      FG_QUEUE_WORKERS: "1"
    shm_size: 8gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  vlm:
    profiles: ["full"]
    image: "${FI_VLLM_IMAGE:-vllm/vllm-openai:v0.11.0}"
    command:
      - --model
      - Qwen/Qwen3-VL-8B-Instruct
      - --revision
      - a115a837cf3cbba4b697aa74b609721b5009ed41
      - --served-model-name
      - Qwen/Qwen3-VL-8B-Instruct
      - --quantization
      - bitsandbytes
      - --load-format
      - bitsandbytes
      - --gpu-memory-utilization
      - "0.88"
      - --limit-mm-per-prompt
      - '{"image":24}'
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - "${HF_HOME:-./data/huggingface}:/root/.cache/huggingface"
    shm_size: 8gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
